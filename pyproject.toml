[project]
name = "tiny-recursive-models"
version = "0.1.0"
description = "Less is More: Recursive Reasoning with Tiny Networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.0",
    "einops>=0.8.1",
    "tqdm>=4.67.1",
    "coolname>=2.2.0",
    "pydantic>=2.11.7",
    "argdantic>=1.3.3",
    "wandb>=0.21.3",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "huggingface_hub>=0.34.4",
    "packaging>=24.1",
    "ninja>=1.13.0",
    "numba>=0.61.2",
    "triton>=3.3.0",
    "adam-atan2-pytorch>=0.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
